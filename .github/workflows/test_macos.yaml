name: Test if the example app still builds on macOS
on:
  push:
    branches: ["main"]
    paths:
      - "common/**"
      - "example/**"
      - "lib/**"
      - "macos/**"
      - "bin/**"
      - "third/download.cmake"
      - "pubspec.yaml"
      - ".github/workflows/test_macos.yaml"
  pull_request:
    paths:
      - "common/**"
      - "example/**"
      - "lib/**"
      - "macos/**"
      - "bin/**"
      - "third/download.cmake"
      - "pubspec.yaml"
      - ".github/workflows/test_macos.yaml"

jobs:
  main:
    # macos-latest is Apple Silicon (arm64).
    runs-on: macos-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install build tools
        run: brew install ninja cmake
      - name: Resolve dependencies
        run: flutter pub get
      - name: Prepare CEF (Debug and Release)
        working-directory: example
        run: dart run webview_cef:setup_macos
      - run: flutter --version
      - name: Analyze plugin
        run: flutter analyze
      - name: Analyze example
        working-directory: example
        run: flutter analyze
      - name: Test plugin
        run: flutter test
      - name: Build Debug with SwiftPM
        working-directory: example
        run: flutter build macos --debug
      - name: Build Release with SwiftPM
        working-directory: example
        run: flutter build macos --release
      - name: Verify CEF bundles and signatures
        run: |
          python3 - <<'PYTHON'
          import pathlib
          import platform
          import subprocess
          for mode in ('Debug', 'Release'):
              app = pathlib.Path(f'example/build/macos/Build/Products/{mode}/webview_cef_example.app')
              frameworks = app / 'Contents/Frameworks'
              cef = frameworks / 'Chromium Embedded Framework.framework'
              helpers = list(frameworks.glob('* Helper*.app'))
              assert len(helpers) == 5, helpers
              assert (cef / 'Versions/Current').is_symlink()
              for bundle in (app, cef, *helpers):
                  subprocess.run(['codesign', '--verify', '--deep', '--strict', str(bundle)], check=True)
              for helper in helpers:
                  binary = helper / 'Contents/MacOS' / helper.stem
                  subprocess.run(['lipo', str(binary), '-verify_arch', platform.machine()], check=True)
          PYTHON
